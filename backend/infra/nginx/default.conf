server {
    listen 80;
    # For production TLS, replace with:
    #   listen 443 ssl;
    #   ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #   ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    server_name _;

    # Defense-in-depth CSP (XSS hardening). This API host serves JSON only, so
    # there are no inline scripts to permit — 'unsafe-inline' is dropped from
    # script-src. The header blocks framing (clickjacking), plugin/content
    # injection, and <base> hijack, and limits fetches to this origin.
    # The SPA (static prototype) carries its OWN strict CSP as a <meta> tag
    # (hash-based, no 'unsafe-inline' in script-src) — see docs/csp.md and
    # tools/strictify-csp.mjs which generates it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    root /var/www/html/public;
    index index.php;

    # Laravel needs the public dir as the only web root
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Payment IPN / callback endpoints must be publicly reachable from the PSP.
    # They are plain API routes; this block just documents the intent and
    # keeps client bodies large enough for signed payloads.
    location /api/payments/ {
        client_max_body_size 2M;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # php:8.2-fpm 官方镜像的 docker.conf 把池监听在 TCP 9000（非 unix socket），
        # 故这里用 127.0.0.1:9000 与 php-fpm 对齐（已实测 /api/v1/health 返回 ok）。
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    # Deny access to hidden files (except ACME challenge)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20M;
}
