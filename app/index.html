<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>GIAONHANH — 越南同城购物配送 APP</title>
<style>
  :root{
    --brand:#ff6a2b; --brand-2:#ffb020; --accent:#2bd4a7;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --font:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#0b0d13; --panel:#151821; --surface:rgba(255,255,255,0.05);
    --surface-2:rgba(255,255,255,0.09); --border:rgba(255,255,255,0.10);
    --border-strong:rgba(255,255,255,0.18); --text:#f4f6fb; --dim:#9aa3b8; --faint:#646d82;
    --glass:rgba(18,21,30,0.6); --shadow:0 20px 50px -24px rgba(0,0,0,.8);
    --map:linear-gradient(135deg,#1b2030,#10131c);
  }
  html[data-theme="light"]{
    --bg:#f4f6fb; --panel:#ffffff; --surface:rgba(20,30,60,0.04);
    --surface-2:rgba(20,30,60,0.07); --border:rgba(15,23,42,0.08);
    --border-strong:rgba(15,23,42,0.14); --text:#131722; --dim:#5a6478; --faint:#9aa3b8;
    --glass:rgba(255,255,255,0.7); --shadow:0 20px 44px -26px rgba(40,50,90,.35);
    --map:linear-gradient(135deg,#eef2fb,#e3e9f6);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{height:100%;}
  body{font-family:var(--font);background:#05060a;color:var(--text);display:flex;justify-content:center;
    align-items:center;min-height:100vh;transition:background .4s var(--ease);}
  body.light-body{background:#c9d2e3;}

  /* ===== Device frame ===== */
  .stage{display:flex;align-items:center;justify-content:center;padding:24px;}
  .device{position:relative;width:min(430px,100vw);height:min(932px,100vh);background:var(--bg);
    border-radius:44px;overflow:hidden;box-shadow:0 0 0 12px #0d0f15,0 0 0 14px #2a2f3c,0 40px 90px -30px rgba(0,0,0,.9);
    transition:background .4s var(--ease);}
  @media(min-width:480px){.device{box-shadow:0 0 0 12px #0d0f15,0 0 0 14px #2a2f3c,0 50px 100px -34px rgba(0,0,0,.9);}}
  @media(max-width:479px){
    html,body{height:100%;overflow:hidden;}
    body{display:block;min-height:100%;}
    .stage{padding:0;display:block;height:100%;}
    .device{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none;overflow:visible;}
    .screen{padding-top:100px!important;padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))!important;}
  }

  /* ===== Status bar ===== */
  .statusbar{position:absolute;top:0;left:0;right:0;height:46px;z-index:50;display:flex;align-items:center;
    justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600;pointer-events:none;
    color:var(--text);}
  .statusbar .right{display:flex;align-items:center;gap:6px;}
  .statusbar .bat{width:24px;height:12px;border:1.5px solid currentColor;border-radius:3px;position:relative;opacity:.9;}
  .statusbar .bat::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:6px;background:currentColor;border-radius:0 2px 2px 0;}
  .statusbar .bat i{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:70%;background:currentColor;border-radius:1px;}

  /* ===== Screens ===== */
  .screens{position:absolute;inset:0;}
  .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-top:46px;padding-bottom:74px;
    display:none;animation:fade .35s var(--ease);}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .device.no-tab .screen{padding-bottom:46px;}
  .device.no-tab .tabbar{transform:translateY(120%);}

  /* ===== Tab bar ===== */
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:70px;z-index:40;display:flex;
    background:var(--glass);backdrop-filter:blur(22px) saturate(180%);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom,0px);
    transition:transform .4s var(--ease),background .4s var(--ease);}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--faint);font-size:11px;font-weight:600;cursor:pointer;transition:color .25s var(--ease);}
  .tab .ic{font-size:21px;line-height:1;filter:grayscale(.4);transition:.25s var(--ease);}
  .tab.active{color:var(--brand);}
  .tab.active .ic{filter:none;transform:translateY(-1px) scale(1.06);}

  /* ===== Splash ===== */
  #screen-splash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(70% 60% at 50% 35%,rgba(255,106,43,.28),transparent 70%),var(--bg);}
  .splash-logo{width:96px;height:96px;border-radius:28px;background:linear-gradient(135deg,var(--brand),var(--brand-2));
    display:grid;place-items:center;font-size:50px;box-shadow:0 20px 50px -16px rgba(255,106,43,.6);
    animation:pop .7s var(--ease);}
  @keyframes pop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .splash-name{font-size:26px;font-weight:850;letter-spacing:-.02em;}
  .splash-sub{color:var(--dim);font-size:14px;}
  .splash-bar{width:140px;height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px;}
  .splash-bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--brand),var(--brand-2));
    border-radius:4px;animation:load 1.4s var(--ease) infinite;}
  @keyframes load{0%{margin-left:-40%;}100%{margin-left:100%;}}

  /* ===== Generic app UI ===== */
  .topbar{position:fixed;top:46px;left:0;right:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;
    background:var(--glass);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);height:54px;}
  @media(min-width:480px){
    .topbar{position:sticky;top:46px;left:auto;right:auto;height:auto;}
  }
  .topbar .back{font-size:22px;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;}
  .topbar .back:active{background:var(--surface);}
  .topbar h1{font-size:17px;font-weight:800;}
  .loc{display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px;cursor:pointer;padding:4px 6px;border-radius:10px;transition:background .2s;}
  .loc:active{background:var(--surface);}
  .loc .pin{font-size:15px;}
  /* ===== City sheet ===== */
  .city-mask{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s var(--ease);}
  .city-mask.show{opacity:1;pointer-events:auto;}
  .city-sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--panel);border-top-left-radius:22px;border-top-right-radius:22px;
    padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .35s var(--ease);
    box-shadow:0 -20px 50px -20px rgba(0,0,0,.7);max-height:72%;overflow-y:auto;}
  .city-sheet.show{transform:translateY(0);}
  .city-sheet h4{font-size:15px;font-weight:800;margin:4px 4px 12px;}
  .city-auto{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:14px;cursor:pointer;font-weight:700;font-size:15px;
    background:linear-gradient(120deg,rgba(255,106,43,.16),rgba(255,176,32,.1));color:var(--brand);margin-bottom:8px;transition:filter .2s;}
  .city-auto:active{filter:brightness(1.12);}
  .city-list{display:flex;flex-direction:column;gap:2px;}
  .city-item{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:14px;cursor:pointer;font-weight:600;font-size:15px;transition:background .2s;}
  .city-item:active{background:var(--surface);}
  .city-item.cur{color:var(--brand);}
  .city-item .ce{font-size:20px;}
  .city-item .ck{margin-left:auto;font-size:18px;}

  /* ===== Agent / recruitment sheet ===== */
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 6px;}
  .sheet-x{font-size:18px;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:9px;color:var(--dim);}
  .sheet-x:active{background:var(--surface);}
  .agent-lead{font-size:13px;color:var(--dim);margin:0 6px 12px;line-height:1.5;}
  .agent-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .agent-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;}
  .agent-card .ac-b{font-size:20px;font-weight:850;color:var(--brand);}
  .agent-card .ac-t{font-size:13px;font-weight:700;}
  .agent-card .ac-d{font-size:11.5px;color:var(--dim);line-height:1.4;}
  .agent-cta{display:block;text-align:center;padding:13px;border-radius:14px;font-weight:800;color:#fff;
    background:linear-gradient(120deg,var(--brand),var(--brand-2));cursor:pointer;}
  .agent-cta:active{filter:brightness(1.08);}
  /* ===== Real map (Leaflet, graceful fallback) ===== */
  #orderMap{height:200px;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--map);margin:0 0 10px;}
  #orderMap .leaflet-container{background:transparent;border-radius:16px;font:inherit;outline:none;}
  .gm-pin{display:grid;place-items:center;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    font-size:15px;box-shadow:0 6px 16px -4px rgba(0,0,0,.5);border:2px solid #fff;}
  .gm-pin span{transform:rotate(45deg);}
  .gm-home{background:linear-gradient(135deg,#34d399,#059669);}
  .gm-store{background:linear-gradient(135deg,var(--brand),var(--brand-2));}
  .gm-rider{background:linear-gradient(135deg,#38bdf8,#2563eb);width:26px;height:26px;}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:9px 14px;color:var(--dim);font-size:13px;cursor:pointer;}
  .pad{padding:16px;}

  /* ===== Search modal ===== */
  .search-mask{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:70;opacity:0;pointer-events:none;transition:opacity .3s var(--ease);}
  .search-mask.show{opacity:1;pointer-events:auto;}
  .search-modal{position:absolute;left:0;right:0;top:0;z-index:71;background:var(--panel);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 16px;
    border-bottom-left-radius:22px;border-bottom-right-radius:22px;transform:translateY(-110%);transition:transform .35s var(--ease);
    box-shadow:0 -20px 50px -20px rgba(0,0,0,.7);}
  .search-modal.show{transform:translateY(0);}
  .search-input{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:11px 16px;margin-bottom:10px;}
  .search-input input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;min-width:0;}
  .search-input input::placeholder{color:var(--faint);}
  .search-results{max-height:64vh;overflow-y:auto;}
  .sr-item{display:flex;align-items:center;gap:12px;padding:13px 8px;border-bottom:1px solid var(--border);cursor:pointer;}
  .sr-item:active{background:var(--surface);}
  .sr-item .se{font-size:22px;width:30px;text-align:center;flex-shrink:0;}
  .sr-item .sn{font-weight:600;font-size:15px;}
  .sr-item .sm{font-size:12px;color:var(--dim);margin-top:2px;}
  .sr-empty{padding:28px 12px;text-align:center;color:var(--dim);font-size:14px;}

  .banner{border-radius:18px;padding:18px;color:#fff;margin:14px 16px 4px;
    background:linear-gradient(120deg,var(--brand),var(--brand-2));position:relative;overflow:hidden;
    box-shadow:0 14px 34px -16px rgba(255,106,43,.6);}
  .banner h3{font-size:19px;font-weight:850;}
  .banner p{font-size:12.5px;opacity:.92;margin-top:4px;}
  .banner .pill{display:inline-block;margin-top:10px;background:rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;}

  .sec-title{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 10px;}
  .sec-title b{font-size:16px;font-weight:800;}
  .sec-title span{font-size:12.5px;color:var(--dim);}

  .quick{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 6px;padding:6px 14px 4px;}
  .quick .q{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
  .quick .q .e{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px;
    background:var(--surface);border:1px solid var(--border);transition:.25s var(--ease);}
  .quick .q:active .e{transform:scale(.92);}
  .quick .q small{font-size:11px;color:var(--dim);font-weight:600;}

  .flash{display:flex;gap:12px;overflow-x:auto;padding:6px 16px 8px;scrollbar-width:none;}
  .flash::-webkit-scrollbar{display:none;}
  .flash .f{flex:0 0 130px;background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:10px;cursor:pointer;}
  .flash .f .ph{height:74px;border-radius:11px;display:grid;place-items:center;font-size:34px;
    background:linear-gradient(135deg,var(--surface-2),var(--surface));}
  .flash .f .nm{font-size:12.5px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .flash .f .pr{font-size:14px;font-weight:850;color:var(--brand);margin-top:3px;}
  .flash .f .pr s{font-size:11px;color:var(--faint);font-weight:500;margin-left:4px;}
  .flash .f .bar{height:5px;border-radius:5px;background:var(--surface-2);margin-top:7px;overflow:hidden;}
  .flash .f .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:5px;}

  .store{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s;}
  .store:active{background:var(--surface);}
  .store .logo{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px;flex-shrink:0;
    background:var(--surface-2);border:1px solid var(--border);}
  .store .info{flex:1;min-width:0;}
  .store .info .nm{font-weight:800;font-size:15.5px;}
  .store .info .meta{font-size:12px;color:var(--dim);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;}
  .store .info .meta .star{color:var(--brand-2);font-weight:700;}
  .store .info .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
  .store .info .tg{font-size:11px;color:var(--dim);background:var(--surface);border:1px solid var(--border);padding:2px 8px;border-radius:999px;}

  /* ===== Category ===== */
  .cat-wrap{display:flex;height:calc(100% - 46px);}
  .cat-left{width:96px;flex-shrink:0;background:var(--surface);overflow-y:auto;border-right:1px solid var(--border);scrollbar-width:none;}
  .cat-left::-webkit-scrollbar{display:none;}
  .cat-left .c{position:sticky;padding:15px 8px;text-align:center;font-size:12.5px;color:var(--dim);cursor:pointer;border-left:3px solid transparent;font-weight:600;}
  .cat-left .c.active{background:var(--bg);color:var(--text);border-left-color:var(--brand);font-weight:800;}
  .cat-right{flex:1;overflow-y:auto;padding:14px;}
  .cat-right .blk{margin-bottom:18px;}
  .cat-right .blk .bh{font-size:13.5px;font-weight:800;margin-bottom:10px;color:var(--brand);}
  .cat-right .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;}
  .cat-right .gi{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
  .cat-right .gi .ge{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--surface);border:1px solid var(--border);}
  .cat-right .gi small{font-size:11px;color:var(--dim);text-align:center;}

  /* ===== Store detail ===== */
  .st-hero{padding:18px 16px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;position:relative;}
  .st-hero .nm{font-size:21px;font-weight:850;}
  .st-hero .m{font-size:13px;opacity:.95;margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;}
  .st-hero .coupon{display:inline-block;margin-top:12px;background:rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;}
  .prod{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);}
  .prod .pe{width:62px;height:62px;border-radius:13px;display:grid;place-items:center;font-size:32px;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border);}
  .prod .pi{flex:1;}
  .prod .pi .pn{font-size:14.5px;font-weight:700;}
  .prod .pi .pd{font-size:12px;color:var(--dim);margin-top:2px;}
  .prod .pi .pp{font-size:15px;font-weight:850;color:var(--brand);margin-top:6px;}
  .stepper{display:flex;align-items:center;gap:10px;}
  .stepper button{width:28px;height:28px;border-radius:50%;border:none;font-size:18px;font-weight:800;cursor:pointer;display:grid;place-items:center;}
  .stepper .minus{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .stepper .plus{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;}
  .stepper .qty{font-weight:800;min-width:18px;text-align:center;}

  /* cart bar */
  .cartbar{position:absolute;left:0;right:0;bottom:0;z-index:35;height:62px;display:flex;align-items:center;gap:12px;
    padding:0 16px;background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--border);}
  .device.no-tab .cartbar{display:none;}
  .cartbar .icon{position:relative;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));
    display:grid;place-items:center;font-size:24px;box-shadow:0 10px 24px -8px rgba(255,106,43,.6);}
  .cartbar .icon .badge{position:absolute;top:-4px;right:-4px;background:#ff3b5c;color:#fff;font-size:11px;font-weight:800;
    min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg);}
  .cartbar .total{flex:1;}
  .cartbar .total .t{font-size:17px;font-weight:850;}
  .cartbar .total .s{font-size:11px;color:var(--dim);}
  .cartbar .go{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;padding:12px 22px;border-radius:14px;font-size:14px;}

  /* ===== Cart screen ===== */
  .cgroup{margin-bottom:16px;}
  .cgroup .gh{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);}
  .cgroup .gh .gl{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--surface-2);}
  .cgroup .gh b{font-size:14.5px;font-weight:800;}
  .row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);}
  .row .re{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:var(--surface-2);}
  .row .ri{flex:1;}
  .row .ri .rn{font-size:14px;font-weight:700;}
  .row .ri .rp{font-size:14px;font-weight:850;color:var(--brand);margin-top:2px;}
  .addr{display:flex;gap:12px;align-items:center;padding:16px;background:var(--surface);margin:14px 16px;border-radius:16px;border:1px solid var(--border);}
  .addr .ai{font-size:22px;}
  .addr .at{flex:1;}
  .addr .at .al{font-size:12px;color:var(--dim);}
  .addr .at .av{font-weight:800;font-size:15px;}
  .addr .ar{color:var(--brand);font-size:20px;}
  .opt{display:flex;gap:10px;padding:0 16px 12px;}
  .opt .o{flex:1;text-align:center;padding:11px;border-radius:12px;border:1px solid var(--border);font-size:13px;font-weight:700;color:var(--dim);cursor:pointer;}
  .opt .o.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .summ{padding:16px;}
  .summ .line{display:flex;justify-content:space-between;font-size:14px;margin-bottom:9px;color:var(--dim);}
  .summ .line b{color:var(--text);}
  .summ .line.tot{font-size:17px;font-weight:850;color:var(--text);border-top:1px solid var(--border);padding-top:12px;margin-top:4px;}
  .summ .line.tot b{color:var(--brand);}
  .coupon-row{display:flex;gap:8px;padding:0 16px 4px;}
  .coupon-input{flex:1;padding:11px 12px;border-radius:12px;border:1px solid var(--border);font-size:13px;background:var(--card);color:var(--text);}
  .coupon-btn{padding:11px 16px;border-radius:12px;border:none;background:var(--brand);color:#fff;font-weight:800;font-size:13px;cursor:pointer;}
  .coupon-msg{font-size:12px;padding:2px 16px 6px;color:var(--dim);min-height:14px;}
  .coupon-msg.ok{color:#047857;}
  .coupon-msg.bad{color:#DC2626;}

  /* ===== Order tracking ===== */

<script>
  /* Integration config resolver.
     Priority: URL ?api= & ?live / ?demo  >  localStorage  >  empty (offline demo).
     The consumer app stays a pure offline demo until a backend base is supplied. */
  window.GN_CONFIG = (function(){
    const q = new URLSearchParams(location.search);
    const storedBase = (localStorage.getItem('gn_api_base') || '').trim();
    const storedUse  = localStorage.getItem('gn_use_api'); // '1' | '0' | null
    let apiBase = (q.get('api') || '').trim() || storedBase;
    let useApi;
    if(q.has('live')) useApi = true;
    else if(q.has('demo')) useApi = false;
    else if(storedUse === '1') useApi = true;
    else if(storedUse === '0') useApi = false;
    else useApi = !!apiBase; // default: live only when a base is configured
    apiBase = apiBase.replace(/\/+$/, ''); // strip trailing slashes
    // Pusher real-time keys (shared with rider/merchant apps via localStorage)
    const pusherKey = (q.get('pusher') || localStorage.getItem('gn_pusher_key') || '').trim();
    const pusherCluster = (q.get('pusherCluster') || localStorage.getItem('gn_pusher_cluster') || 'ap1').trim();
    return {
      apiBase: apiBase,
      useApi: useApi,
      pusherKey: pusherKey,
      pusherCluster: pusherCluster,
      payReturnUrl: "giaonhanh://pay/return",
      momoPartnerCode: "", momoAccessKey: "", momoSecretKey: "",
      zaloAppId: "", zaloKey1: ""
    };
  })();
</script>

function renderCitySheet(){

  h+=`<div class="city-auto" data-auto="1">🛰️ ${APP[lang].city_auto||"自动定位"}</div>`;

function selectCity(vi){
  const c=CITIES.find(x=>x.vi===vi); if(!c) return;
  APP[lang].loc=c[lang]; localStorage.setItem("gn_city",c.vi); applyText();
  closeCitySheet();
  if(window.GN&&GN.toast) GN.toast((lang==="zh"?"已切换到 ":"Đã chọn ")+c[lang],"success");
}
function autoLocate(silent){
  if(!navigator.geolocation){ if(!silent && window.GN&&GN.toast) GN.toast(lang==="zh"?"当前环境不支持定位":"Không hỗ trợ định vị","error"); return; }
  if(!silent && window.GN&&GN.toast) GN.toast(lang==="zh"?"正在定位…":"Đang định vị…","info");
  navigator.geolocation.getCurrentPosition(pos=>{
    const la=pos.coords.latitude, lo=pos.coords.longitude;
    let best=CITIES[0],bd=1e9;
    CITIES.forEach(c=>{const d=(c.lat-la)**2+(c.lng-lo)**2; if(d<bd){bd=d;best=c;}});
    selectCity(best.vi);
    if(!silent && window.GN&&GN.toast) GN.toast((lang==="zh"?"已定位到 ":"Đã định vị ")+best[lang],"success");
  },()=>{
    if(!silent && window.GN&&GN.toast) GN.toast(lang==="zh"?"定位失败，请手动选择":"Định vị thất bại","error");
  },{enableHighAccuracy:false,timeout:8000,maximumAge:60000});
}
function restoreCity(){
  const v=localStorage.getItem("gn_city");
  if(v){const c=CITIES.find(x=>x.vi===v); if(c) APP[lang].loc=c[lang];}
}

let searchEl=null, searchMaskEl=null, searchInputEl=null, searchResultsEl=null, searchScope=null;
function mountSearch(){
  if(searchEl) return;
  searchMaskEl=document.createElement("div"); searchMaskEl.className="search-mask";
  searchEl=document.createElement("div"); searchEl.className="search-modal";
  searchMaskEl.onclick=closeSearch;
  searchEl.innerHTML=`<div class="search-input">🔍 <input type="search" id="gnSearchInput" /><span id="gnSearchCancel" style="color:var(--dim);font-size:18px;cursor:pointer;padding:0 4px;">✕</span></div><div class="search-results" id="gnSearchResults"></div>`;
  $("#device").appendChild(searchMaskEl); $("#device").appendChild(searchEl);
  searchInputEl=searchEl.querySelector("#gnSearchInput");
  searchResultsEl=searchEl.querySelector("#gnSearchResults");
  searchInputEl.oninput=()=>renderSearchResults(searchInputEl.value);
  searchEl.querySelector("#gnSearchCancel").onclick=closeSearch;
}
function openSearch(scope){
  searchScope=scope||null;
  mountSearch();
  searchInputEl.placeholder = scope ? (APP[lang].search_ph_store||"搜索本店商品") : APP[lang].search_ph;
  searchInputEl.value=""; renderSearchResults("");
  requestAnimationFrame(()=>{ searchMaskEl.classList.add("show"); searchEl.classList.add("show"); try{searchInputEl.focus();}catch(e){} });
}
function closeSearch(){ if(searchEl){ searchEl.classList.remove("show"); searchMaskEl.classList.remove("show"); } }
function renderSearchResults(q){
  q=(q||"").trim().toLowerCase();
  const entries=[];
  if(searchScope){
    const s=STORES.find(x=>x.id===searchScope);
    if(s) s.prods.forEach(p=>entries.push({type:"prod",store:s,prod:p}));
  } else {
    STORES.forEach(s=>{ entries.push({type:"store",store:s}); s.prods.forEach(p=>entries.push({type:"prod",store:s,prod:p})); });
  }
  const hit=e=>{
    if(!q) return true;
    if(e.type==="store"){ const s=e.store; return s.nm.vi.toLowerCase().includes(q)||s.nm.zh.toLowerCase().includes(q)||(s.cat&&s.cat.toLowerCase().includes(q)); }
    const p=e.prod; return p.nm.vi.toLowerCase().includes(q)||p.nm.zh.toLowerCase().includes(q);
  };
  const list=entries.filter(hit);
  if(!list.length){ searchResultsEl.innerHTML=`<div class="sr-empty">${APP[lang].search_empty||"没有找到相关结果"}</div>`; return; }
  searchResultsEl.innerHTML=list.slice(0,50).map(e=>{
    if(e.type==="store"){ const s=e.store;
      return `<div class="sr-item" data-store="${s.id}"><div class="se">${s.e}</div><div><div class="sn">${s.nm[lang]}</div><div class="sm">★ ${s.rate} · 🛵 ${s.time}</div></div></div>`;
    }
    const p=e.prod, s=e.store;
    return `<div class="sr-item" data-store="${s.id}"><div class="se">${p.e}</div><div><div class="sn">${p.nm[lang]}</div><div class="sm">${fmt(p.pr)} · ${s.nm[lang]}</div></div></div>`;
  }).join("");
  searchResultsEl.querySelectorAll(".sr-item").forEach(el=>el.onclick=()=>{ const sid=el.dataset.store; closeSearch(); openStore(sid); });
}

let current="splash"; let backStack=[];
function _show(name){
  // Leaving the order screen? Stop its background timers (demo + live) to avoid leaks.
  if(name!=="order"){
    if(trackTimer){ clearInterval(trackTimer); trackTimer=null; }
    if(orderPoll){ clearInterval(orderPoll); orderPoll=null; }
    if(window._gnLeafletMap){ try{ window._gnLeafletMap.remove(); }catch(e){} window._gnLeafletMap=null; window._gnRiderMarker=null; }
  }
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $("#screen-"+name).classList.add("active");
  const noTab=["splash","store","cart","order"].includes(name);
  $("#device").classList.toggle("no-tab",noTab);
  current=name;
  if(name==="store") renderStore();
  if(name==="cart") renderCart();
  if(name==="order") renderOrder();
}
function go(name){ backStack.push(current); _show(name); }
function back(){ if(backStack.length) _show(backStack.pop()); else _show("home"); }
function tab(name){ backStack=[]; _show(name);
  document.querySelectorAll("#tabbar .tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===name)); }

function renderStore(){

      <div class="nm">${esc(s.nm[lang])}</div>

  $("#storeDetail").querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{ decCart(s.id,b.dataset.dec); });

function updateStoreCartBar(){
  const items=cart.filter(c=>c.storeId===currentStoreId);
  const qty=items.reduce((a,b)=>a+b.qty,0);
  const total=items.reduce((a,b)=>a+b.pr*b.qty,0);
  const bar=$("#storeCartBar");
  if(qty>0){ bar.style.display="flex"; $("#storeBadge").textContent=qty; $("#storeTotal").textContent=fmt(total); }
  else bar.style.display="none";
}

function addToCart(item){
  const ex=cart.find(c=>c.storeId===item.storeId&&c.id===item.id);
  if(ex) ex.qty++; else cart.push({...item,qty:1});
  if(current==="store") updateStoreCartBar();
  if(current==="cart") renderCart();
  if(current==="home"||current==="category") tab("home");
}
function decCart(storeId,id){
  const ex=cart.find(c=>c.storeId===storeId&&c.id===id);
  if(!ex) return; ex.qty--; if(ex.qty<=0) cart=cart.filter(c=>!(c.storeId===storeId&&c.id===id));
  if(current==="store") renderStore();
  if(current==="cart") renderCart();
}

function renderCart(){

    $("#cartBody").innerHTML=`<div class="empty"><div class="e">🛒</div>${APP[lang].cart_empty}<br><span style="font-size:12.5px">${APP[lang].cart_empty_s}</span></div>`;
    return;
  }
  // group by store
  const groups={};
  cart.forEach(c=>{ (groups[c.storeId]=groups[c.storeId]||[]).push(c); });
  let html="";
  Object.keys(groups).forEach(sid=>{
    const s=STORES.find(x=>x.id===sid); const items=groups[sid];
    const sub=items.reduce((a,b)=>a+b.pr*b.qty,0);
    html+=`<div class="cgroup"><div class="gh"><div class="gl">${s?s.e:"🎁"}</div><b>${s?s.nm[lang]:"Flash Sale"}</b></div>`;
    items.forEach(it=>{
      html+=`<div class="row"><div class="re">${it.e}</div><div class="ri"><div class="rn">${it.nm[lang]}</div><div class="rp">${fmt(it.pr*it.qty)}</div></div>
        <div class="stepper"><button class="minus" data-dstore="${it.storeId}" data-did="${it.id}">−</button><span class="qty">${it.qty}</span><button class="plus" data-istore="${it.storeId}" data-iid="${it.id}">+</button></div></div>`;
    });
    html+=`</div>`;
  });
  // address + delivery + coupon + summary
  const total=cart.reduce((a,b)=>a+b.pr*b.qty,0);
  const couponTotal=Object.values(cartCoupon).reduce((s,d)=>s+((d&&d.discount)||0),0);
  const grand=Math.max(0,total-couponTotal);

// Verify a coupon against every store in the cart (a merchant code only
// applies to its own merchant). Valid discounts are cached in cartCoupon and
// shown in the summary; the code is consumed only at order creation.
async function applyCoupon(){
  const ci=document.getElementById("couponInput");
  const code=(ci?ci.value:"").trim();
  couponInputVal=code;
  if(!code){ cartCoupon={}; showCouponMsg(""); renderCart(); return; }
  const stores={};
  cart.forEach(c=>{ if(c.storeId && c.storeId!=="flash"){ stores[c.storeId]=(stores[c.storeId]||0)+c.pr*c.qty; } });
  const valid={}; let any=false;
  if(GN_CONFIG.useApi && GN_CONFIG.apiBase){
    for(const sid in stores){
      try{
        const r=await GN.API.verifyCoupon(code, sid, stores[sid]);
        if(r&&r.valid){ valid[sid]={code, discount:r.discount}; any=true; }
      }catch(e){ /* not valid for this store */ }
    }
  }
  cartCoupon=valid;
  showCouponMsg(any?APP[lang].coupon_applied:APP[lang].coupon_invalid, any);
  renderCart();
}
async function startOrder(){
  const total=cart.reduce((a,b)=>a+b.pr*b.qty,0);
  const couponTotal=Object.values(cartCoupon).reduce((s,d)=>s+((d&&d.discount)||0),0);
  const grand=Math.max(0,total-couponTotal);

  /* ---- LIVE path: create a real backend order + pay ---- */
  if(GN_CONFIG.useApi && GN_CONFIG.apiBase && LIVE && LIVE.ready && GN.token){
    try{
      const loc = await getLoc();
      const groups={}; cart.forEach(c=>{ (groups[c.storeId]=groups[c.storeId]||[]).push(c); });
      const storeIds=Object.keys(groups).filter(s=>s!=="flash"); // flash items lack a real merchant in live mode
      if(storeIds.length){
        const method='cod'; // prototype default; gateway methods open pay_url then poll
        let primary=null;
        for(const sid of storeIds){
          const items=groups[sid].map(c=>({product_id:c.id, qty:c.qty}));
          const payload={
            merchant_id:sid, items, pay_method:method,
            address:(lang==="vi"?"123 Đường Tràng Tiền, Hoàn Kiếm, Hà Nội":"河内还剑郡长前路123号"),
            lat: loc?loc.lat:null, lng: loc?loc.lng:null,
            contact_name:"Nguyen Van A", contact_phone:"0900000002",
            delivery_type: deliMode==="now"?"instant":"appointment",
          };
          if(cartCoupon[sid]) payload.coupon_code=cartCoupon[sid].code; // merchant coupon for this store
          const r=await GN.API.createOrder(payload);
          if(!r||r.offline||!r.order_no) throw new Error("create failed");
          const pr=await GN.pay({method, amount:r.amount, orderNo:r.order_no});
          let paid=pr&&pr.paid;
          if(pr&&pr.pending){ const w=await GN.waitForPayment(r.order_no); paid=w&&w.paid; }
          if(paid && !primary) primary=r;
        }
          if(primary){
          const det=await GN.API.order(primary.order_no);
          currentOrder = (det&&!det.offline) ? liveToOrder(det)
            : {_live:true, orderNo:primary.order_no, status:"paid", steps:ORDER_STEPS, currentIndex:1, eta:30, merchant:"", address:""};
          if(window.GN && GN.voice) GN.voice.say('order_placed');
          cart=[]; tab("order"); return;
        }
      }
      throw new Error("no live order");
    }catch(e){ console.warn("[GN] live order failed, fallback to demo", e); }
  }

  /* ---- OFFLINE demo path ---- */
  currentOrder={items:[...cart],total:Math.round(grand),mode:deliMode,eta:32,step:0};
  if(window.GN && GN.voice) GN.voice.say('order_placed');
  cart=[]; tab("order");
}

let orderPoll=null;
function ensureLeaflet(){
  if(window.L) return Promise.resolve(true);
  return new Promise((res)=>{
    let fin=false; const done=(v)=>{ if(fin) return; fin=true; res(v); };
    const s=document.createElement('script'); s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.crossOrigin='anonymous';
    s.onload=()=>done(true); s.onerror=()=>done(false);
    document.head.appendChild(s);
    const c=document.createElement('link'); c.rel='stylesheet'; c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(c);
    setTimeout(()=>done(!!window.L),4500);
  });
}
function mountOrderMap(o){
  const el=$("#orderMap"); if(!el) return Promise.resolve(false);
  return ensureLeaflet().then(ok=>{
    if(!ok || !window.L){ // graceful fallback: decorative SVG map inside the slot
      el.outerHTML=`<div class="map"><div class="grid-bg"></div><div class="store-p">🏪</div><div class="home-p">🏠</div><div class="rider" id="rider">🛵</div></div>`;
      return false;
    }
    const L=window.L;
    const mLat=+o.merchantLat, mLng=+o.merchantLng, cLat=+o.lat, cLng=+o.lng;
    const map=L.map(el,{zoomControl:false,attributionControl:false,scrollWheelZoom:false}).setView([(mLat+cLat)/2,(mLng+cLng)/2],14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
    L.polyline([[mLat,mLng],[cLat,cLng]],{color:'#ff6a2b',weight:4,dashArray:'6 8',opacity:.85}).addTo(map);
    const pin=(lat,lng,cls,emoji)=>{
      const icon=L.divIcon({className:'',html:`<div class="gm-p-in ${cls}"><span>${emoji}</span></div>`,iconSize:[30,30],iconAnchor:[15,28]});
      return L.marker([lat,lng],{icon}).addTo(map);
    };
    pin(mLat,mLng,'gm-store','🏪'); pin(cLat,cLng,'gm-home','🏠');
    const rIcon=L.divIcon({className:'',html:`<div class="gm-p-in gm-rider"><span>🛵</span></div>`,iconSize:[26,26],iconAnchor:[13,24]});
    const rMarker=L.marker([mLat,mLng],{icon:rIcon}).addTo(map);
    window._gnLeafletMap=map; window._gnRiderMarker=rMarker;
    const pct=Math.max(0,Math.min(1,o.currentIndex/5));
    rMarker.setLatLng([mLat+(cLat-mLat)*pct, mLng+(cLng-mLng)*pct]);
    setTimeout(()=>{ try{ map.invalidateSize(); }catch(e){} },80);
    return true;
  });
}

  if(window._gnRiderMarker && o.lat!=null && o.merchantLat!=null){
    const pct=Math.max(0,Math.min(1,o.currentIndex/5));
    const rLat=+o.merchantLat+(+o.lat-+o.merchantLat)*pct, rLng=+o.merchantLng+(+o.lng-+o.merchantLng)*pct;
    window._gnRiderMarker.setLatLng([rLat,rLng]);
    if(window._gnLeafletMap) try{ window._gnLeafletMap.panTo([rLat,rLng]); }catch(e){}
  } else {
    const rider=$("#rider");
    if(rider){ const pct=Math.max(0,Math.min(1,o.currentIndex/5)); rider.style.left=(8+82*pct)+"%"; rider.style.top=(80-66*pct)+"%"; }
  }
  const st=$("#trackSt");
  if(st){
    if(delivered) st.textContent="✅ "+(lang==="vi"?"Đã giao":"已送达");
    else if(cancelled) st.textContent="⛔ "+(lang==="vi"?"Đã hủy":"已取消");
    else { const lbl=(ORDER_STEP_LABEL[o.steps[o.currentIndex]]&&ORDER_STEP_LABEL[o.steps[o.currentIndex]][lang])||""; st.textContent="🛵 "+lbl; }
  }
  const eta=$("#etaMin");
  if(eta) eta.textContent=Math.max(0,o.eta-(o.currentIndex*5));
}

/* ===================== INIT ===================== */
setTheme(theme); setLang(lang);
$(".loc").onclick=openCitySheet;
$('[data-search="home"]').onclick=()=>openSearch(null);
$('[data-search="store"]').onclick=()=>openSearch(currentStoreId);
if(!localStorage.getItem("gn_city")){ try{ autoLocate(true); }catch(e){} } // best-effort auto locate on first open
loadLiveData(); // fire-and-forget; replaces demo data when useApi:true
setTimeout(()=>{ if($("#pfMenu")) renderProfileMenu(); }, 0); // refresh voice-mute state after GN.voice loads
// splash -> landing screen (honour a #hash so "返回消费者端" lands on 我的, not home)
setTimeout(()=>{
  const h=(location.hash||"").replace(/^#/,"");
  const target=(["home","category","order","profile"].includes(h))?h:"home";
  _show(target);
  document.querySelectorAll("#tabbar .tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===target));
  if(h) history.replaceState(null,"",location.pathname+location.search); // clear the return-hash after landing
},1600);
</script>
